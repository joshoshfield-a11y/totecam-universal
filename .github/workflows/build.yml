name: Build ToteCam APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android SDK components
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Stage artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ToteCam-v1.0.0.apk
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: ToteCam-v1.0.0-apk
          path: out/ToteCam-v1.0.0.apk
